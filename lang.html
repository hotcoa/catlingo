<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Catlingo</title>
    <meta name="robots" content="noindex">
    <style>
        :root {
            color-scheme: light;
            --ink: #1B2A4A;
            --paper: #FFFDF7;
            --edge: #C9A227;
            --accent: #9E2B25;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 1.5rem;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: linear-gradient(160deg, #EAF4FB 0%, #FBEAF0 55%, #FFF6E8 100%);
            color: var(--ink);
        }

        main {
            width: min(100%, 34rem);
            background: rgba(255, 253, 247, 0.96);
            border: 2px solid var(--edge);
            border-radius: 16px;
            padding: 1.4rem 1.5rem;
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.14);
        }

        h1 {
            margin: 0 0 0.55rem;
            font-size: 1.45rem;
        }

        p {
            margin: 0.55rem 0;
            line-height: 1.5;
        }

        a {
            color: var(--accent);
            font-weight: 700;
        }

        .hint {
            color: #5a5247;
            font-size: 0.95rem;
        }
    </style>
    <script>
        (function () {
            if (window.location.protocol === 'file:') {
                return;
            }
            const target = new URL('./', window.location.href).href;
            if (target !== window.location.href) {
                window.location.replace(target);
            }
        })();
    </script>
</head>
<body>
    <main>
        <h1>Catlingo moved</h1>
        <p>This compatibility page now lives at <a href="./">the Catlingo home page</a>.</p>
        <p class="hint">If you opened this file directly with <code>file://</code>, use the link above or open <a href="./index.html">index.html</a> instead of relying on an automatic redirect.</p>
    </main>
</body>
</html>
